[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsebench"
version = "0.1.0"
description = "Vector Store Evaluation at Scale — pgvector, Qdrant, and Weaviate benchmarked at 10M vectors"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "you@example.com"},
]
keywords = ["vector-database", "benchmark", "pgvector", "qdrant", "weaviate", "embeddings", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "datasets>=2.18",
    "sentence-transformers>=2.5",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "qdrant-client>=1.8",
    "weaviate-client>=4.5",
    "httpx>=0.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rich>=13.7",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "locust>=2.22",
    "boto3>=1.34",
    "google-cloud-storage>=2.14",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "ruff>=0.2",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "coverage>=7.4",
]

[project.scripts]
vsebench = "vsebench.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/vector-store-evaluation-at-scale"
Repository = "https://github.com/yourusername/vector-store-evaluation-at-scale"

[tool.hatch.build.targets.wheel]
packages = ["src/vsebench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
